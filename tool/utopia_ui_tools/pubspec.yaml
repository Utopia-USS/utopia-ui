name: utopia_ui_tools
version: 0.1.0
description: >-
  CLI for the utopia_ui design protocol: validate design tokens, generate the
  Flutter theme, HTML twin and component manifest, and catch design drift in CI.
repository: https://github.com/Utopia-USS/utopia-ui/tree/main/tool/utopia_ui_tools
issue_tracker: https://github.com/Utopia-USS/utopia-ui/issues
topics:
  - design-tokens
  - design-system
  - cli
  - codegen

environment:
  sdk: ^3.11.0

executables:
  export_tokens: export_tokens
  validate_tokens: validate_tokens
  generate_manifest: generate_manifest
  validate_manifest: validate_manifest
  generate_theme: generate_theme
  generate_twin: generate_twin
  validate_twin: validate_twin

dependencies:
  flutter:
    sdk: flutter
  utopia_ui: ^0.1.0
  analyzer: ^8.4.1
  args: ^2.7.0
  path: ^1.9.1
  json_schema: ^5.2.2
  yaml: ^3.1.3
  dart_style: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  utopia_lints: ^0.0.3+1

dependency_overrides:
  # Dev-time override so this nested package builds against the working
  # checkout while the pubspec keeps a normal hosted constraint on utopia_ui.
  # tool/publish_utopia_ui_tools.sh strips this block from the published copy.
  utopia_ui:
    path: ../..
