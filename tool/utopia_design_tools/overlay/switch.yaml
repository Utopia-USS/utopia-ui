states: [on, readOnly, disabled]
notes: >-
  A themed on/off switch, styled from UtopiaThemeColors instead of the ambient
  MaterialApp theme. on is the toggled-on track/thumb rendering (value: true);
  readOnly blocks interaction while keeping the full-color styling; a null
  onChanged (without readOnly) is the disabled state and renders faded at 50%
  opacity.
examples:
  - example/lib/sections/selection_section.dart
