name: utopia_ui
version: 0.1.0
description: "A themeable, general-purpose Flutter design system: tables, dialogs, sidebar navigation and form primitives."
repository: https://github.com/Utopia-USS/utopia-ui

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  utopia_hooks: ^0.4.25
  utopia_collections: ^0.1.2
  fast_immutable_collections: ^11.2.0
  shimmer: ^3.0.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  freezed: ^3.2.3
  utopia_lints: ^0.0.3+1
